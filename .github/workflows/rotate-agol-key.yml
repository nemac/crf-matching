name: Rotate AGOL API Key

on:
  workflow_dispatch:
    inputs:
      force_rotate:
        description: 'Regenerate the slot NOT in SSM even if more than 30 days remain. Do not use right after a failed redeploy.'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Only report what would happen; never rotate or redeploy'
        required: false
        default: true
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: rotate-agol-key
  cancel-in-progress: false

jobs:
  check-and-rotate:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: write
    outputs:
      redeploy_needed: ${{ steps.decide-redeploy.outputs.redeploy_needed }}

    steps:
      - name: Keep scheduled workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "/repos/${{ github.repository }}/actions/workflows/rotate-agol-key.yml/enable" || true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install ArcGIS REST dependencies
        run: npm install --no-save --ignore-scripts @esri/arcgis-rest-developer-credentials@4.11.0 @esri/arcgis-rest-request@4.11.0 @esri/arcgis-rest-portal@4.11.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::104538610210:role/crf-matching-github-actions-role
          aws-region: us-east-1

      - name: Fetch current AGOL_API_KEY from SSM
        id: current-key
        run: |
          set -euo pipefail
          CURRENT_KEY=$(aws ssm get-parameter --name "/crf-matching/agol-api-key" --with-decryption --query "Parameter.Value" --output text)
          if [ -z "$CURRENT_KEY" ] || [ "$CURRENT_KEY" = "None" ]; then
            echo "::error::/crf-matching/agol-api-key is empty in SSM"
            exit 1
          fi
          echo "::add-mask::$CURRENT_KEY"
          echo "agol_api_key=$CURRENT_KEY" >> "$GITHUB_OUTPUT"
          LAST_MODIFIED=$(aws ssm get-parameter --name "/crf-matching/agol-api-key" --query "Parameter.LastModifiedDate" --output text)
          echo "last_modified=$LAST_MODIFIED" >> "$GITHUB_OUTPUT"

      - name: Check expiration and rotate AGOL API key if needed
        id: rotate
        env:
          AGOL_USERNAME: ${{ secrets.AGOL_USERNAME }}
          AGOL_PASSWORD: ${{ secrets.AGOL_PASSWORD }}
          AGOL_API_KEY: ${{ steps.current-key.outputs.agol_api_key }}
          FORCE_ROTATE: ${{ inputs.force_rotate || 'false' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node node-scripts/rotate-agol-key.js

      - name: Update AGOL_API_KEY in AWS SSM Parameter Store
        if: steps.rotate.outputs.rotated == 'true'
        env:
          NEW_API_KEY: ${{ steps.rotate.outputs.new_api_key }}
        run: |
          aws ssm put-parameter \
            --name "/crf-matching/agol-api-key" \
            --type "SecureString" \
            --value "$NEW_API_KEY" \
            --overwrite

      - name: Decide whether to redeploy
        id: decide-redeploy
        if: always() && !cancelled() && steps.current-key.outcome == 'success'
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          ROTATED: ${{ steps.rotate.outputs.rotated }}
          KEY_LAST_MODIFIED: ${{ steps.current-key.outputs.last_modified }}
        run: |
          set -euo pipefail
          RETRY_WINDOW_SECONDS=$((30 * 24 * 60 * 60))
          KEY_AGE_SECONDS=$(( $(date +%s) - $(date -d "$KEY_LAST_MODIFIED" +%s) ))
          if [ "$DRY_RUN" = "true" ]; then
            REDEPLOY_NEEDED=false
          elif [ "$ROTATED" = "true" ]; then
            REDEPLOY_NEEDED=true
          elif [ "$KEY_AGE_SECONDS" -lt "$RETRY_WINDOW_SECONDS" ]; then
            echo "Key changed in SSM less than 30 days ago. Redeploying again in case the last redeploy failed."
            REDEPLOY_NEEDED=true
          else
            REDEPLOY_NEEDED=false
          fi
          echo "redeploy_needed=$REDEPLOY_NEEDED" >> "$GITHUB_OUTPUT"

  redeploy:
    needs: check-and-rotate
    if: always() && !cancelled() && needs.check-and-rotate.outputs.redeploy_needed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ matrix.branch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        branch: [master, develop]

    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::104538610210:role/crf-matching-github-actions-role
          aws-region: us-east-1

      - name: Create .env file
        run: |
          AGOL_API_KEY=$(aws ssm get-parameter --name "/crf-matching/agol-api-key" --with-decryption --query "Parameter.Value" --output text)
          echo "::add-mask::$AGOL_API_KEY"
          echo "AIRTABLE_TOKEN='${{ secrets.AIRTABLE_TOKEN }}'" > .env
          echo "AIRTABLE_BASE='${{ secrets.AIRTABLE_BASE }}'" >> .env
          echo "AGOL_API_KEY='$AGOL_API_KEY'" >> .env

      - name: Build
        run: npm run build

      - name: Upload to S3
        run: |
          if [ "${{ matrix.branch }}" = "master" ]; then
            BUCKET=s3://crf-matching
          elif [ "${{ matrix.branch }}" = "develop" ]; then
            BUCKET=s3://crf-matching-dev
          fi
          aws s3 sync dist/ "$BUCKET"
          aws s3 sync dist/ "$BUCKET" --delete --exclude "assets/*.docx"

      - name: Invalidate CloudFront
        run: |
          if [ "${{ matrix.branch }}" = "master" ]; then
            aws cloudfront create-invalidation \
              --distribution-id E6AN64MGEH6XD \
              --paths "/*"
            aws cloudfront create-invalidation \
              --distribution-id E3LE6G8XQS44Y4 \
              --paths "/*"
            aws cloudfront create-invalidation \
              --distribution-id E35676Q3CH6Y85 \
              --paths "/*"
          elif [ "${{ matrix.branch }}" = "develop" ]; then
            aws cloudfront create-invalidation \
              --distribution-id E2NM5QT3AUD8LF \
              --paths "/*"
          fi
